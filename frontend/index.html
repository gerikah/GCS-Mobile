<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ground Control System - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'gcs-dark': '#0a0d15',
            'gcs-background': '#101321',
            'gcs-primary': 'var(--gcs-primary)',
            'gcs-primary-light': 'var(--gcs-primary-light)',
            'gcs-primary-dark': 'var(--gcs-primary-dark)',
            'gcs-text-on-primary': 'var(--gcs-text-on-primary)',
            'gcs-orange': 'var(--gcs-primary)', // Keep gcs-orange for compatibility
            'gcs-text-dark': '#f6f7fb',
            'gcs-text-light': '#f5f7ff',
            'gcs-card': '#191d2d',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
          // --- ADD THIS KEYFRAMES/ANIMATION BLOCK ---
          keyframes: {
            'fade-in-fast': {
              '0%': { opacity: '0', transform: 'translateY(-10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          },
          animation: {
            'fade-in-fast': 'fade-in-fast 0.2s ease-out forwards',
          }
          // --- END OF ADDITION ---
        }
      }
    }
    </script>
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
      .leaflet-control-attribution {
        font-size: 0.6rem !important; /* Smaller font size for attribution */
      }
      .app-shell-bg {
        background-image:
          linear-gradient(180deg, rgba(255, 70, 79, 0.06), transparent 18%),
          linear-gradient(145deg, #080a12 0%, #111421 48%, #181c2c 100%);
      }
      .app-theme .bg-white {
        background-color: #191d2d !important;
      }
      .app-theme .bg-gray-100 {
        background-color: #111521 !important;
      }
      .app-theme .bg-gray-200 {
        background-color: #202437 !important;
      }
      .app-theme .border-gray-200 {
        border-color: rgba(115, 130, 160, 0.22) !important;
      }
      .app-theme .bg-white,
      .app-theme .bg-gray-100,
      .app-theme .bg-gray-200 {
        color: #f6f7fb !important;
      }
      .app-theme .bg-white .text-gray-400,
      .app-theme .bg-white .text-gray-500,
      .app-theme .bg-white .text-gray-600,
      .app-theme .bg-white .text-gray-700,
      .app-theme .bg-white .text-black,
      .app-theme .bg-white .text-gcs-text-dark,
      .app-theme .bg-gray-100 .text-gray-400,
      .app-theme .bg-gray-100 .text-gray-500,
      .app-theme .bg-gray-100 .text-gray-600,
      .app-theme .bg-gray-100 .text-gray-700,
      .app-theme .bg-gray-100 .text-black,
      .app-theme .bg-gray-100 .text-gcs-text-dark,
      .app-theme .bg-gray-200 .text-gray-400,
      .app-theme .bg-gray-200 .text-gray-500,
      .app-theme .bg-gray-200 .text-gray-600,
      .app-theme .bg-gray-200 .text-gray-700,
      .app-theme .bg-gray-200 .text-black,
      .app-theme .bg-gray-200 .text-gcs-text-dark {
        color: #f6f7fb !important;
      }
      .app-theme .text-black,
      .app-theme .text-gcs-text-dark {
        color: #f6f7fb !important;
      }
      .app-theme .text-gray-500,
      .app-theme .text-gray-600,
      .app-theme .text-gray-700 {
        color: #7f8da8 !important;
      }
      .app-theme input,
      .app-theme select {
        background: #0e111b !important;
        border-color: rgba(115, 130, 160, 0.24) !important;
        color: #f6f7fb !important;
      }
      .app-theme input::placeholder {
        color: #64718c !important;
      }
      :root {
        --gcs-primary: #ff454f;
        --gcs-primary-light: #ff6b6f;
        --gcs-primary-dark: #c82f39;
        --gcs-text-on-primary: #FFFFFF;
      }
      .theme-purple {
        --gcs-primary: #8B5CF6;
        --gcs-primary-light: #A78BFA;
        --gcs-primary-dark: #7C3AED;
        --gcs-text-on-primary: #FFFFFF;
      }
      .theme-orange {
        --gcs-primary: #ff454f;
        --gcs-primary-light: #ff6b6f;
        --gcs-primary-dark: #c82f39;
        --gcs-text-on-primary: #FFFFFF;
      }
      .theme-blue {
        --gcs-primary: #3B82F6;
        --gcs-primary-light: #60A5FA;
        --gcs-primary-dark: #2563EB;
        --gcs-text-on-primary: #FFFFFF;
      }
      .theme-green {
        --gcs-primary: #10B981;
        --gcs-primary-light: #34D399;
        --gcs-primary-dark: #059669;
        --gcs-text-on-primary: #FFFFFF;
      }
      .theme-black {
        --gcs-primary: #1F2937;
        --gcs-primary-light: #374151;
        --gcs-primary-dark: #111827;
        --gcs-text-on-primary: #FFFFFF;
      }
    </style>
